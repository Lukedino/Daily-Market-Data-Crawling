name: "OHLC Backfill — US/Crypto 초기 적재"

on:
  workflow_dispatch:
    inputs:
      market:
        description: '대상 시장'
        type: choice
        options: [all, us, crypto]
        default: all
      start_year:
        description: '수집 시작 연도'
        required: false
        default: '2020'
      end_year:
        description: '수집 종료 연도 (기본: 작년)'
        required: false
        default: ''
      dry_run:
        description: '테스트 실행 (저장 없음)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: OHLC Backfill
        env:
          MARKET:                     ${{ inputs.market }}
          START_YEAR:                 ${{ inputs.start_year }}
          END_YEAR:                   ${{ inputs.end_year }}
          DRY_RUN:                    ${{ inputs.dry_run }}
          GDRIVE_FOLDER_ID:            ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OHLC_FOLDER_ID:       ${{ secrets.GDRIVE_OHLC_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          set -euo pipefail
          [[ "$START_YEAR" =~ ^[0-9]{4}$ ]] || { echo "invalid start_year: $START_YEAR"; exit 1; }
          [[ -z "$END_YEAR" || "$END_YEAR" =~ ^[0-9]{4}$ ]] || { echo "invalid end_year: $END_YEAR"; exit 1; }
          ARGS=(--mode ohlc-backfill --upload-drive --market "$MARKET" --start-year "$START_YEAR")
          [ -n "$END_YEAR" ] && ARGS+=(--end-year "$END_YEAR")
          [[ "$DRY_RUN" == "true" ]] && ARGS+=(--dry-run)
          python main.py "${ARGS[@]}"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohlc-backfill-log-${{ github.run_id }}
          path: collection.log
      - name: Cleanup credentials
        if: always()
        run: rm -f gdrive_creds.json
