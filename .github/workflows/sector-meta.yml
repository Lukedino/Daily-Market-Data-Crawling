name: "Sector Meta — US/Crypto 종목 메타데이터 주간 수집"

on:
  schedule:
    # 매주 일요일 UTC 01:00 (KST 10:00) — 주 트레이딩 종료 후, 월요일 장 전
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      market:
        description: '대상 시장'
        type: choice
        options: [all, us, crypto]
        default: all
      dry_run:
        description: '테스트 실행 (저장 없음)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # US 600종목 .info 호출 여유 시간

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Sector Meta
        env:
          GDRIVE_OHLC_FOLDER_ID:       ${{ secrets.GDRIVE_OHLC_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GDRIVE_LUKE_PICKS_FILE_ID:   ${{ secrets.GDRIVE_LUKE_PICKS_FILE_ID }}
        run: |
          ARGS="--mode sector-meta --upload-drive --market ${{ inputs.market || 'all' }}"
          ${{ inputs.dry_run == 'true' && 'true' || 'false' }} && ARGS="$ARGS --dry-run"
          python main.py $ARGS

      - name: Upload log
        if: always()
        # 아티팩트 서비스가 딸꾹하면(FinalizeArtifact 403 등) 이 스텝 실패로 잡 전체가
        # failure 가 되고, 아래 실패 알림이 '주문/수집이 실패했다'고 단정해 오보를 낸다.
        # 2026-09-09 실측: 주문 스텝은 success 인데 업로드 403 하나로 '🚨 주문 실패'
        # 알림이 갔다. 로그 보존은 부수 기능이라 본 작업의 성패를 대변하면 안 된다.
        # (업로드가 실패해도 GHA 화면의 인라인 로그는 90일 남는다.)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sector-meta-log-${{ github.run_id }}
          path: collection.log
          retention-days: 7

      - name: Cleanup credentials
        if: always()
        run: rm -f gdrive_creds.json

      # 주 1회 실행이라 놓치면 섹터·산업 태그가 한 주 낡은 채로 남는다. 2026-08-31
      # 실행이 NameError로 죽은 적이 있는데 그때도 알림이 없어 사람이 발견했다.
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET:           ${{ inputs.market || 'all' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "텔레그램 시크릿 미설정 - 실패 알림 생략"
            exit 0
          fi
          MSG="🚨 Sector Meta 수집 실패 — 대상: ${MARKET}. 섹터·산업 태그가 이번 주에 갱신되지 않았습니다. 주 1회 실행이라 다음 자동 기회는 다음 일요일입니다. 로그: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" > /dev/null
