name: "OHLC Daily Update — US/Crypto 증분 업데이트"

on:
  # 예약 실행은 Personal Assistant 저장소의 apps/orchestrator/config/gha-schedules.json
  # (ohlc-us: 22:23 UTC 월~토 market=all · ohlc-crypto: 00:41 UTC 매일 market=crypto)이
  # Cloud Scheduler tick 으로 workflow_dispatch 를 호출해 깨운다(2026-09-16 이관).
  # GitHub schedule 은 예약 큐 지연이 1.5~5시간이라 폐기. cron 을 되살리려면
  # 그쪽 항목을 enabled:false 로 바꾼 뒤 여기에 schedule: 블록을 복원한다.
  workflow_dispatch:
    inputs:
      market:
        description: '대상 시장'
        type: choice
        options: [all, us, crypto]
        default: all
      dry_run:
        description: '테스트 실행'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # yfinance 배치 재시도(백오프) 최악의 경우 대비 여유 확보

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: OHLC Daily Update
        env:
          # 00:41 UTC 크론은 크립토 확정 캔들 전용이라 market을 crypto로 고정한다.
          # workflow_dispatch로 돌리면 github.event.schedule이 빈 값이므로
          # 사용자가 고른 inputs.market이 그대로 쓰인다.
          SCHEDULE:                    ${{ github.event.schedule }}
          INPUT_MARKET:                ${{ inputs.market || 'all' }}
          DRY_RUN:                     ${{ inputs.dry_run || 'false' }}
          GDRIVE_FOLDER_ID:            ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OHLC_FOLDER_ID:       ${{ secrets.GDRIVE_OHLC_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GDRIVE_LUKE_PICKS_FILE_ID:   ${{ secrets.GDRIVE_LUKE_PICKS_FILE_ID }}
        run: |
          if [ "$SCHEDULE" = "41 0 * * *" ]; then
            MARKET=crypto
          else
            MARKET="$INPUT_MARKET"
          fi
          echo "실행 대상 시장: $MARKET (schedule='$SCHEDULE')"
          ARGS="--mode ohlc-update --upload-drive --market $MARKET"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          python main.py $ARGS
      - name: Upload log
        if: always()
        # 아티팩트 서비스가 딸꾹하면(FinalizeArtifact 403 등) 이 스텝 실패로 잡 전체가
        # failure 가 되고, 아래 실패 알림이 '주문/수집이 실패했다'고 단정해 오보를 낸다.
        # 2026-09-09 실측: 주문 스텝은 success 인데 업로드 403 하나로 '🚨 주문 실패'
        # 알림이 갔다. 로그 보존은 부수 기능이라 본 작업의 성패를 대변하면 안 된다.
        # (업로드가 실패해도 GHA 화면의 인라인 로그는 90일 남는다.)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ohlc-daily-log-${{ github.run_id }}
          path: collection.log
          retention-days: 7
      - name: Cleanup credentials
        if: always()
        run: rm -f gdrive_creds.json

      # 2026-09-06·09-08 US 증분이 연속성 게이트에 걸려 죽었는데 알림이 없어
      # 며칠 뒤에야 알았다(그 사이 소비 측은 하루 늦은 데이터로 돌았다).
      # ⚠️ 대상 시장은 위 스텝의 출력이 아니라 github.event.schedule로 다시 판별한다.
      #    checkout·pip install에서 죽으면 그 스텝이 아예 안 돌아 출력이 비고,
      #    그러면 전부 같은 시장으로 오인된다.
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE:         ${{ github.event.schedule }}
          INPUT_MARKET:     ${{ inputs.market || 'all' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "텔레그램 시크릿 미설정 - 실패 알림 생략"
            exit 0
          fi
          if [ "$SCHEDULE" = "41 0 * * *" ]; then
            MARKET="crypto (일봉 확정 사이클)"
          elif [ -n "$SCHEDULE" ]; then
            MARKET="$INPUT_MARKET (미국 장마감 사이클)"
          else
            MARKET="$INPUT_MARKET (수동 실행)"
          fi
          MSG="🚨 OHLC Daily 수집 실패 — 대상: ${MARKET}. US/크립토 시세가 갱신되지 않았습니다. 하류 영향: ML 분석·Trading-AI-Pipeline·ATR 모니터가 하루 늦은 데이터로 돕니다. 로그: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" > /dev/null
