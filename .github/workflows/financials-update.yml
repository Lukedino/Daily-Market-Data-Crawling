name: "Financials Update — US/Crypto 재무 데이터"

on:
  # 예약 실행은 Personal Assistant 저장소의 apps/orchestrator/config/gha-schedules.json
  # (financials-monthly: 매월 1일 01:00 UTC = 10:00 KST, market=all)이 Cloud Scheduler tick 으로
  # workflow_dispatch 를 호출해 깨운다(2026-09-25 이관). 월 1회 스냅샷(ratios 기관보유 추세는 월간 3개 기준).
  # 정시가 필요한 이유: KR 단계는 kr-daily 저장일 == 실행 시점 KRX max_work_dt 여야 통과하는데
  # max_work_dt 는 거래일 장 마감 후(15:30~21:4x KST) 그날로 바뀐다. GitHub schedule 은 큐 지연으로
  # KR 단계가 12:00~16:30 에 시작해 이 전환을 넘길 수 있었다.
  # cron 을 되살리려면 그쪽 항목을 enabled:false 로 바꾼 뒤 여기에 schedule: 블록을 복원한다
  # (옛 '0 1 1-7 * 1' 은 cron OR 규칙으로 1~7일 매일 + 매주 월요일이었다 — 되살릴 땐 '0 1 1 * *').
  workflow_dispatch:
    inputs:
      market:
        description: '대상 시장'
        type: choice
        options: [all, us, crypto, kr]
        default: all
      dry_run:
        description: '테스트 실행'
        type: boolean
        default: false

permissions:
  contents: read

# All markets share Drive metadata; retain queued jobs as well as the active job.
concurrency:
  group: daily-market-drive-writer
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # KR 재무(DART 1000종목, 2026-09-03 신설)로 35분→106~120분. 120이면 여유 0~15분이라 DART 가 느린 날 타임아웃

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Financials Update
        env:
          GDRIVE_FOLDER_ID:            ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OHLC_FOLDER_ID:       ${{ secrets.GDRIVE_OHLC_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GDRIVE_LUKE_PICKS_FILE_ID:   ${{ secrets.GDRIVE_LUKE_PICKS_FILE_ID }}
          DART_API_KEY:                ${{ secrets.DART_API_KEY }}
        run: |
          ARGS="--mode financials-update --upload-drive --market ${{ inputs.market || 'all' }}"
          ${{ inputs.dry_run || 'false' }} && ARGS="$ARGS --dry-run"
          python main.py $ARGS
      - name: Upload log
        if: always()
        # 아티팩트 서비스가 딸꾹하면(FinalizeArtifact 403 등) 이 스텝 실패로 잡 전체가
        # failure 가 되고, 아래 실패 알림이 '주문/수집이 실패했다'고 단정해 오보를 낸다.
        # 2026-09-09 실측: 주문 스텝은 success 인데 업로드 403 하나로 '🚨 주문 실패'
        # 알림이 갔다. 로그 보존은 부수 기능이라 본 작업의 성패를 대변하면 안 된다.
        # (업로드가 실패해도 GHA 화면의 인라인 로그는 90일 남는다.)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: financials-log-${{ github.run_id }}
          path: collection.log
          retention-days: 14
      - name: Cleanup credentials
        if: always()
        run: rm -f gdrive_creds.json

      # 월 1회 실행이라 한 번 놓치면 그 달 스냅샷이 통째로 비고, 다음 자동 기회는
      # 한 달 뒤다. ratios 기관보유 추세는 월간 스냅샷 3개가 쌓여야 판정되므로
      # 한 달 결손이 분기 단위 지연으로 번진다 — 조용히 지나가면 안 된다.
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET:           ${{ inputs.market || 'all' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "텔레그램 시크릿 미설정 - 실패 알림 생략"
            exit 0
          fi
          MSG="🚨 Financials Update 실패 — 대상: ${MARKET}. 이번 달 재무·ratios 스냅샷이 수집되지 않았습니다. 월 1회 실행이라 다음 자동 기회는 다음 달 1일입니다. 수동 재실행을 권합니다. 로그: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" > /dev/null
