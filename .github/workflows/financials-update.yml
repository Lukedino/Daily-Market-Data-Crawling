name: "Financials Update — US/Crypto 재무 데이터"

on:
  schedule:
    # 매월 1일 UTC 01:00 (KST 10:00) — 월 1회 스냅샷 (ratios 기관보유 추세는 월간 스냅샷 3개 기준)
    # 주의: 옛 '0 1 1-7 * 1'(첫째 월요일 의도)은 cron OR 규칙으로 1~7일 매일 + 매주 월요일 실행됐음 (2026-09-04 발견)
    - cron: '0 1 1 * *'
  workflow_dispatch:
    inputs:
      market:
        description: '대상 시장'
        type: choice
        options: [all, us, crypto, kr]
        default: all
      dry_run:
        description: '테스트 실행'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # US 600종목 info 수집은 시간 걸림

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Financials Update
        env:
          GDRIVE_FOLDER_ID:            ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OHLC_FOLDER_ID:       ${{ secrets.GDRIVE_OHLC_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GDRIVE_LUKE_PICKS_FILE_ID:   ${{ secrets.GDRIVE_LUKE_PICKS_FILE_ID }}
          DART_API_KEY:                ${{ secrets.DART_API_KEY }}
        run: |
          ARGS="--mode financials-update --upload-drive --market ${{ inputs.market || 'all' }}"
          ${{ inputs.dry_run || 'false' }} && ARGS="$ARGS --dry-run"
          python main.py $ARGS
      - name: Upload log
        if: always()
        # 아티팩트 서비스가 딸꾹하면(FinalizeArtifact 403 등) 이 스텝 실패로 잡 전체가
        # failure 가 되고, 아래 실패 알림이 '주문/수집이 실패했다'고 단정해 오보를 낸다.
        # 2026-09-09 실측: 주문 스텝은 success 인데 업로드 403 하나로 '🚨 주문 실패'
        # 알림이 갔다. 로그 보존은 부수 기능이라 본 작업의 성패를 대변하면 안 된다.
        # (업로드가 실패해도 GHA 화면의 인라인 로그는 90일 남는다.)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: financials-log-${{ github.run_id }}
          path: collection.log
          retention-days: 14
      - name: Cleanup credentials
        if: always()
        run: rm -f gdrive_creds.json

      # 월 1회 실행이라 한 번 놓치면 그 달 스냅샷이 통째로 비고, 다음 자동 기회는
      # 한 달 뒤다. ratios 기관보유 추세는 월간 스냅샷 3개가 쌓여야 판정되므로
      # 한 달 결손이 분기 단위 지연으로 번진다 — 조용히 지나가면 안 된다.
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET:           ${{ inputs.market || 'all' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "텔레그램 시크릿 미설정 - 실패 알림 생략"
            exit 0
          fi
          MSG="🚨 Financials Update 실패 — 대상: ${MARKET}. 이번 달 재무·ratios 스냅샷이 수집되지 않았습니다. 월 1회 실행이라 다음 자동 기회는 다음 달 1일입니다. 수동 재실행을 권합니다. 로그: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" > /dev/null
